spring:
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always   # run schema.sql then data.sql at startup
  jpa:
    hibernate:
      ddl-auto: none # tables come from schema.sql
    show-sql: false
  h2:
    console:
      enabled: true
